name: Windows CI

on:
  push:
    branches: [main, develop, 'pre-release/**']
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Optional pre-release tag, e.g. v0.2.1-alpha.2"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-windows:
    name: Build and test (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE ".vcpkg-cache") | Out-Null

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: windows-x64-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            windows-x64-vcpkg-

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg-$baseline"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout --detach $baseline
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vcpkgRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download manifest dependencies
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows-static --x-manifest-root "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed." }

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: Stage application
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist"
          cmake --install out/build/windows-msvc --config Release --prefix $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "FPVSignalTrainer-windows-x64.zip") -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPVSignalTrainer-windows-x64
          path: FPVSignalTrainer-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Pre-release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pre-release/')) || (github.event_name == 'workflow_dispatch' && inputs.prerelease_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.prerelease_tag }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            $tag = $env:REQUESTED_TAG.Trim()
          } else {
            $tag = $env:GITHUB_REF_NAME -replace '^pre-release/', ''
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+-(alpha|beta)(\.\d+)?$') {
            throw "Invalid pre-release tag: $tag"
          }
          gh release create $tag "FPVSignalTrainer-windows-x64.zip" --target $env:GITHUB_SHA --title $tag --prerelease --generate-notes

      - name: Publish GitHub Stable Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "FPVSignalTrainer-windows-x64.zip" --title ${{ github.ref_name }} --generate-notes

name: Сообщить об ошибке
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Не публикуйте пароли, токены, персональные данные или закрытые сведения техникума."
  - type: textarea
    id: summary
    attributes:
      label: Описание проблемы
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows, Unity и версия приложения/commit
  - type: input
    id: headset
    attributes:
      label: Гарнитура и версия Meta Quest Link
  - type: input
    id: cable
    attributes:
      label: Кабель и USB-порт
  - type: input
    id: simulator
    attributes:
      label: Симулятор БПЛА
  - type: textarea
    id: logs
    attributes:
      label: Логи и материалы (без секретов и персональных данных)
